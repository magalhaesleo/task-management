services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "18888:18888" # Dashboard UI
      - "18889:18889" # OTLP/gRPC endpoint
    environment:
      - ASPNETCORE_URLS=http://+:18888
      - DOTNET_DASHBOARD_OTLP_ENDPOINT_URL=http://+:18889
      - DASHBOARD__FRONTEND__AUTHMODE=Unsecured # Use for local dev only

  taskmanagementapi:
    image: taskmanagementapi
    ports:
     - "5000:8080"
    build:
      context: backend/
      dockerfile: TaskManagementApi/Dockerfile
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
